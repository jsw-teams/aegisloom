# Operator-owned behavior policy, loaded before upstream rules. Updaters never replace it.
# Per engine/isolate: burst 120 requests, refill 20/s, ban 300s; 3 confirmed attacks/60s also ban.
# All values/actions and exemptions remain controlled by the operator.
SecAction "id:1000200,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
Include emergency.conf
SecRule IP:edgeshield_blocked "@eq 1" "id:1000201,phase:1,deny,status:403,log,msg:'Temporary behavior protection'"
SecAction "id:1000202,phase:1,pass,nolog,deprecatevar:ip.edgeshield_rate=20/1,setvar:ip.edgeshield_rate=+1,expirevar:ip.edgeshield_rate=60"
SecRule IP:edgeshield_rate "@gt 120" "id:1000203,phase:1,deny,status:403,log,msg:'Request burst protection',setvar:ip.edgeshield_blocked=1,expirevar:ip.edgeshield_blocked=300,setvar:!ip.edgeshield_attacks,setvar:!ip.edgeshield_rate"
# Count once, after disrupted requests too; chained effects are applied only on their own match.
SecAction "id:1000208,phase:5,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
SecRule TX:blocking_inbound_anomaly_score "@ge %{tx.inbound_anomaly_score_threshold}" "id:1000206,phase:5,pass,nolog,setvar:tx.edgeshield_attack=1"
SecRule &IP:edgeshield_blocked "@eq 0" "id:1000204,phase:5,pass,nolog,chain"
SecRule TX:edgeshield_attack "@eq 1" "setvar:ip.edgeshield_attacks=+1,expirevar:ip.edgeshield_attacks=60"
SecRule &IP:edgeshield_blocked "@eq 0" "id:1000205,phase:5,pass,nolog,chain"
SecRule IP:edgeshield_attacks "@ge 3" "setvar:ip.edgeshield_blocked=1,expirevar:ip.edgeshield_blocked=300,setvar:!ip.edgeshield_attacks,setvar:!ip.edgeshield_rate"
