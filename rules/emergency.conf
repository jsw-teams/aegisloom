# Native SecLang virtual patches maintained and tested with the engine.
# CVE-2025-29927: reject the externally supplied Next.js internal subrequest header.
# Vendor workaround: https://github.com/vercel/next.js/security/advisories/GHSA-f82v-jwr5-mffw
SecRule &REQUEST_HEADERS:x-middleware-subrequest "@gt 0" "id:1000300,phase:1,deny,status:403,log,msg:'Next.js middleware authorization bypass',tag:'CVE-2025-29927',setvar:tx.edgeshield_attack=1"
