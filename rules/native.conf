# Native SecLang: supported baseline; archived CRS is not blindly enabled.
SecRule REQUEST_FILENAME "@rx (?:^|/)\.env(?:[./]|$)" "id:110001,phase:1,deny,t:lowercase"
SecRule REQUEST_FILENAME "@rx (?:^|/)\.git(?:/|$)" "id:110002,phase:1,deny,t:lowercase"
SecRule REQUEST_FILENAME "@rx (?:^|/)\.svn(?:/|$)" "id:110003,phase:1,deny,t:lowercase"
SecRule REQUEST_FILENAME "@rx (?:^|/)wp-config\.php$" "id:110004,phase:1,deny,t:lowercase"
SecRule REQUEST_FILENAME "@rx ^/actuator/(?:env|heapdump|configprops)" "id:110005,phase:1,deny,t:lowercase"
SecRule ARGS "@rx union\s+(?:all\s+)?select\s+" "id:110006,phase:2,deny,t:lowercase"
SecRule ARGS "@rx <script(?:[\s>/])" "id:110007,phase:2,deny,t:lowercase"
SecRule REQUEST_HEADERS:User-Agent "@contains jndi:" "id:110008,phase:1,deny,t:lowercase"
