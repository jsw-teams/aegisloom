version: "1"
rules:
  - id: exploit-marker
    name: 拒绝攻击回归标记 / Block regression attack marker
    description: An explicit operator-authored example; not a general injection detector.
    service: api
    priority: 10
    placement: runtime-required
    when:
      field: query
      key: q
      op: contains
      value: shield-attack-test
    then:
      action: block
    cache:
      enabled: true
      ttl: 1m
    community:
      report: false
  - id: login-rate
    name: 登录频率限制 / Login rate limit
    service: api
    priority: 20
    when:
      path: /api/login
      method: POST
      requests:
        moreThan: 20
        within: 1m
        groupBy: verifiedClientIp
    then:
      action: rate-limit
      duration: 10m
