version: "1"
rules:
  - id: demo-marker
    name: 拦截演示攻击标记 / demonstration marker
    service: api
    priority: 10
    when:
      field: query
      key: q
      op: contains
      value: shield-demo-attack
    then:
      action: block
    cache:
      enabled: true
      ttl: 1m
    community:
      report: false
