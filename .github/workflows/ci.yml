name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Calendar version matches the CLI
        run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Full engine, five platform builds, uploads, relay and security tests
        run: npm test
      - run: npm run build
      - run: npm run check:edge
      - run: npm run cloudflare:dry-run
      - run: npm run verify:package
      - run: npm run audit
