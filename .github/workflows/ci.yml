name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm --prefix api-shield-convert ci
      - name: Static schema validator is current
        run: node scripts/generate-validator.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Security regressions
        run: npm run test:security
      - run: npm run test:converter
      - run: npm run build
      - run: npm run check:edge
      - run: npm run cloudflare:dry-run
      - run: npm run verify:package
      - run: npm run smoke:local
      - run: npm audit --omit=dev --audit-level=moderate
