name: Scheduled rule and CVE repository maintenance
on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rules/curated.json'
      - 'rules/baseline.json'
      - 'rules/regression.json'
      - 'rules/sources.yaml'
      - 'rules/inventory.json'
      - 'rules/emergency-paths.json'
      - 'scripts/maintain-rules.mjs'
      - 'scripts/sync-upstream-rules.mjs'
      - 'scripts/check-rule-coverage.mjs'
      - '.github/workflows/rules-maintenance.yml'
permissions:
  contents: read
concurrency:
  group: rule-files-maintenance
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm install --no-audit --no-fund
      - run: npm --prefix api-shield-convert install --no-audit --no-fund
      - name: Run regression and package checks
        run: npm run check
      - name: Archive official CRS source as non-executable candidates
        run: node scripts/sync-upstream-rules.mjs
      - name: Rebuild verified rule files and CVE report
        run: node scripts/maintain-rules.mjs
      - name: Verify generated policy structure
        run: node dist/packages/cli/main.js validate rules/active.json
      - name: Reject placeholder-only rule sets
        run: node scripts/check-rule-coverage.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: tested-rule-output
          path: |
            rules/active.json
            rules/cve-candidates.json
            rules/upstream/crs/**
          if-no-files-found: error
          retention-days: 2
  commit:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Reject stale scan results
        env:
          TESTED_HEAD: ${{ needs.verify.outputs.base }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
      - uses: actions/download-artifact@v8
        with:
          name: tested-rule-output
          path: rules
      - name: Commit ONLY validated generated rule files
        run: |
          git add -- rules/active.json rules/cve-candidates.json rules/upstream/crs
          if git diff --cached --quiet; then
            echo 'Rule files unchanged'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(rules): update validated rule and CVE files'
          git push origin HEAD:main
