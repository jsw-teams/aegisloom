tenant: local
service: api
publicHosts: [api.example.com]
policyFile: rules.yaml
routes:
  - path: /health
    methods: [GET, HEAD]
    authenticated: false
    body: none
origin: https://private-origin.example.com
allowedOrigins: [https://private-origin.example.com]
originTokenEnv: SHIELD_ORIGIN_TOKEN
listen:
  host: 0.0.0.0
  port: 8787
decisions:
  kind: sqlite
  path: /data/decisions.db
